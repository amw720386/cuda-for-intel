[package]
name = "cudart_shim"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal CUDA Runtime API shim over cuda-for-intel's Driver API"

[lib]
name = "cudart64_12"
crate-type = ["cdylib"]

[dependencies]
libloading = "0.8"
lz4_flex = { version = "0.11", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# CUDA 12+ fatbins commonly use Zstd (flag 0x8000); match ZLUDA FatbinFileHeaderFlags.
zstd = { version = "0.13", default-features = false }
