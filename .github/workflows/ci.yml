name: ci
# Everything here runs without a GPU. Hardware tests (tests/gpu, scripts/validate-gpu.ps1) are
# run by hand on an Intel Arc machine; see docs/release-checklist.md.
on:
  push:
    branches: [main, integration, release-cand]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build workspace
        run: cargo build --locked --workspace
      - name: Library tests (includes the SPIR-V simulator and translator tests)
        run: cargo test --locked --lib --workspace
  simulator:
    name: spir-v simulator and translator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - name: "sim, flow, coverage, tier2/3 and ggml conformance tests (fake Level Zero backend)"
        run: "cargo test --locked --lib -p cuda-for-intel -- ptx::"
      - name: XMX interpreter and generators
        run: cargo test --locked -p cublas_shim
  ptx-corpus-macos:
    name: translator, simulator and ZLUDA vectors on macOS (corpus harness)
    # The main crate does not build on macOS; the harness compiles src/ptx on its own.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - name: "src/ptx unit tests, including zluda_vector_tests"
        run: cargo test --release --locked --manifest-path tests/ptx_corpus/harness/Cargo.toml
      - name: PTX corpus matches expected_status.tsv
        run: sh tests/ptx_corpus/run.sh
  ptx-tests-sim:
    name: vosen/ptx_tests on the simulator (macOS)
    # ptx_tests (MIT OR Apache-2.0) is cloned at the commit tests/ptx_tests/run.sh pins, built with
    # RUSTC_BOOTSTRAP=1, and pointed at simcuda (translator + SPIR-V simulator behind 12 Driver API calls).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - name: ptx_tests match tests/ptx_tests/expected_status.tsv (default and CFI_EXACT_FTZ=1)
        run: |
          sh tests/ptx_tests/run.sh
          sh tests/ptx_tests/run.sh --exact-ftz
  coverage-docs:
    name: generated coverage docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ZLUDA (MIT OR Apache-2.0) is fetched here only, read as text, never built or committed.
      # Bump the ref together with docs/zluda-parity.md and tests/ptx_corpus/zluda/vectors.tsv.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vosen/ZLUDA
          ref: f4df215edbc3b6698a1c61ef7a8688fdff3872be
          path: _zluda
          persist-credentials: false
      - name: docs/api-coverage.md matches the tree
        run: |
          python3 -I scripts/api_audit.py --check || { echo "stale: run python3 -I scripts/api_audit.py"; exit 1; }
      - name: docs/zluda-parity.md section 1 matches the tree and pinned ZLUDA
        run: python3 -I scripts/zluda_parity/parity.py _zluda . "$RUNNER_TEMP/parity" --check-doc
      - name: tests/ptx_corpus/zluda/vectors.tsv matches pinned ZLUDA
        run: |
          python3 -I tests/ptx_corpus/import_zluda.py _zluda --vectors
          git diff --exit-code -- tests/ptx_corpus/zluda/vectors.tsv
  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Advisory until the existing formatting and lint backlog is cleared: these report but do
      # not fail the run. Remove continue-on-error once `cargo fmt --check` and clippy are clean.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all --check
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --locked --lib --workspace -- -D warnings
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: scan tracked files for IPs, hosts, user paths, keys
        run: bash scripts/scan-leaks.sh
  windows-redirect:
    name: cfi-run redirect (windows, no GPU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - name: unit tests (mapping, PE import reader, launcher quoting, SASS-only module naming)
        run: cargo test --locked -p cfi_redirect -p cfi_launcher -p cfi-fatbin
      - name: "LoadLibraryW of a full-path cublas64_12.dll gets ours, also in a CreateProcessW child; app dir untouched"
        shell: pwsh
        run: pwsh -File scripts/tests/redirect-ci.ps1
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: parse installer scripts
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: installer dry run (no GPU needed)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'cfi-dry'
          pwsh -File scripts/cfi.ps1 install -InstallDir $d -DryRun -Force -BinDir scripts
          if (Test-Path $d) { throw 'dry run created the install directory' }
          pwsh -File scripts/cfi-doctor.ps1 -InstallDir $d
