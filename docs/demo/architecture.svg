<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" role="img" aria-labelledby="t d"><title id="t">CUDA for Intel architecture</title><desc id="d">CUDA app, genuine CUDA runtime, Rust nvcuda shim, PTX to SPIR-V translator with kernel substitution, Level Zero, Intel Arc GPU.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:#8b949e}</style><rect width="900" height="760" rx="16" fill="#0d1117" stroke="#30363d"/><text x="450" y="32" font-size="15" class="mut" text-anchor="middle">CUDA for Intel: the whole path from app to Arc</text><rect x="110" y="56" width="680" height="66" rx="12" fill="#161b22" stroke="#30363d"/><rect x="110" y="56" width="7" height="66" rx="3.5" fill="#58a6ff"/><text x="134" y="86.0" font-size="17" font-weight="bold">CUDA app</text><text x="134" y="106.0" font-size="12.5" class="mut">Stock Ollama, llama.cpp, PyTorch, your own PTX-carrying program</text><rect x="110" y="56" width="680" height="66" rx="12" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.000;0.056;0.111;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 124 V132 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="110" y="140" width="680" height="66" rx="12" fill="#161b22" stroke="#30363d"/><rect x="110" y="140" width="7" height="66" rx="3.5" fill="#8b949e"/><text x="134" y="170.0" font-size="17" font-weight="bold">CUDA Runtime (genuine NVIDIA cudart)</text><text x="134" y="190.0" font-size="12.5" class="mut">unchanged; calls the Driver API</text><rect x="110" y="140" width="680" height="66" rx="12" fill="#8b949e" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.111;0.167;0.222;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 208 V216 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="110" y="224" width="680" height="66" rx="12" fill="#161b22" stroke="#30363d"/><rect x="110" y="224" width="7" height="66" rx="3.5" fill="#f2c14e"/><text x="134" y="254.0" font-size="17" font-weight="bold">nvcuda.dll shim (Rust)</text><text x="134" y="274.0" font-size="12.5" class="mut">Driver API, contexts, streams, graphs; cuBLAS / cuBLASLt stand-ins</text><rect x="110" y="224" width="680" height="66" rx="12" fill="#f2c14e" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.222;0.278;0.333;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 292 V300 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="110" y="308" width="680" height="66" rx="12" fill="#161b22" stroke="#30363d"/><rect x="110" y="308" width="7" height="66" rx="3.5" fill="#3fb950"/><text x="134" y="338.0" font-size="17" font-weight="bold">PTX parser + normaliser</text><text x="134" y="358.0" font-size="12.5" class="mut">reads the PTX the CUDA program carries</text><rect x="110" y="308" width="680" height="66" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.333;0.389;0.444;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 376 V384 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="110" y="392" width="680" height="66" rx="12" fill="#161b22" stroke="#30363d"/><rect x="110" y="392" width="7" height="66" rx="3.5" fill="#3fb950"/><text x="134" y="422.0" font-size="17" font-weight="bold">PTX to SPIR-V translator</text><text x="134" y="442.0" font-size="12.5" class="mut">OpenCL-environment SPIR-V</text><rect x="110" y="392" width="680" height="66" rx="12" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.444;0.500;0.556;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 460 V468 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="110" y="476" width="680" height="80" rx="12" fill="#161b22" stroke="#30363d"/><rect x="110" y="476" width="7" height="80" rx="3.5" fill="#bc8cff"/><text x="134" y="513.0" font-size="17" font-weight="bold">Kernel substitution layer (on by default)</text><text x="134" y="533.0" font-size="12.5" class="mut">recognised ggml kernels (mmvq, quantize_q8_1, Q8_0 mmq) swapped for<tspan x='134' dy='15'> hand-written Intel SPIR-V;  falls back to the translated kernel on any mismatch</tspan></text><rect x="110" y="476" width="680" height="80" rx="12" fill="#bc8cff" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.556;0.611;0.667;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 558 V566 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="110" y="574" width="680" height="66" rx="12" fill="#161b22" stroke="#30363d"/><rect x="110" y="574" width="7" height="66" rx="3.5" fill="#58a6ff"/><text x="134" y="604.0" font-size="17" font-weight="bold">Level Zero</text><text x="134" y="624.0" font-size="12.5" class="mut">loads the module, launches the kernel</text><rect x="110" y="574" width="680" height="66" rx="12" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.667;0.722;0.778;1" dur="9s" repeatCount="indefinite"/></rect><path d="M450 642 V650 m-6 -6 l6 6 l6 -6" stroke="#8b949e" stroke-width="2" fill="none"/><rect x="110" y="658" width="680" height="66" rx="12" fill="#161b22" stroke="#30363d"/><rect x="110" y="658" width="7" height="66" rx="3.5" fill="#1f6feb"/><text x="134" y="688.0" font-size="17" font-weight="bold">Intel Arc GPU (Arc B390)</text><text x="134" y="708.0" font-size="12.5" class="mut">runs it</text><rect x="110" y="658" width="680" height="66" rx="12" fill="#1f6feb" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.778;0.833;0.889;1" dur="9s" repeatCount="indefinite"/></rect><text x="450" y="746" font-size="12" class="mut" text-anchor="middle">PTX only (no SASS/cubin). Experimental. Details: docs/architecture.md</text></svg>