<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d"><title id="t">A kernel launch travelling through the shim</title><desc id="d">A packet labelled PTX moves from the CUDA app through the shim and translator, becomes SPIR-V, goes through Level Zero and reaches the Arc GPU.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .mut{fill:#8b949e}</style><rect width="900" height="300" rx="16" fill="#0d1117" stroke="#30363d"/><text x="450" y="30" font-size="15" class="mut" text-anchor="middle">one kernel launch, end to end</text><line x1="90" y1="150" x2="810" y2="150" stroke="#30363d" stroke-width="3" stroke-dasharray="4 6"/><rect x="28" y="104" width="124" height="92" rx="14" fill="#161b22" stroke="#30363d"/><text x="90" y="132" font-size="22" text-anchor="middle" class="m" style="fill:#8b949e">1</text><text x="90" y="178" font-size="13.5" text-anchor="middle" font-weight="bold">CUDA app</text><rect x="208" y="104" width="124" height="92" rx="14" fill="#161b22" stroke="#30363d"/><text x="270" y="132" font-size="22" text-anchor="middle" class="m" style="fill:#8b949e">2</text><text x="270" y="178" font-size="13.5" text-anchor="middle" font-weight="bold">nvcuda shim</text><rect x="388" y="104" width="124" height="92" rx="14" fill="#161b22" stroke="#30363d"/><text x="450" y="132" font-size="22" text-anchor="middle" class="m" style="fill:#8b949e">3</text><text x="450" y="178" font-size="13.5" text-anchor="middle" font-weight="bold">PTX → SPIR-V</text><rect x="568" y="104" width="124" height="92" rx="14" fill="#161b22" stroke="#30363d"/><text x="630" y="132" font-size="22" text-anchor="middle" class="m" style="fill:#8b949e">4</text><text x="630" y="178" font-size="13.5" text-anchor="middle" font-weight="bold">Level Zero</text><rect x="748" y="104" width="124" height="92" rx="14" fill="#161b22" stroke="#30363d"/><text x="810" y="132" font-size="22" text-anchor="middle" class="m" style="fill:#8b949e">5</text><text x="810" y="178" font-size="13.5" text-anchor="middle" font-weight="bold">Arc GPU</text><rect x="388" y="214" width="124" height="34" rx="9" fill="#161b22" stroke="#bc8cff" stroke-dasharray="4 3"/><text x="450" y="236" font-size="12.5" text-anchor="middle" class="m">substitute?</text><path d="M450 198 V212" stroke="#bc8cff" stroke-width="2"/><g><circle r="13" cx="90" cy="150" fill="#58a6ff"><animate attributeName="cx" values="90;450;450" keyTimes="0;.5;1" dur="7s" repeatCount="indefinite"/><animate attributeName="cy" values="150;150;150" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.49;.5;1" dur="7s" repeatCount="indefinite"/></circle><circle r="13" cx="450" fill="#3fb950" cy="150"><animate attributeName="cx" values="450;450;810;810" keyTimes="0;.5;1;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.51;.98;1" dur="7s" repeatCount="indefinite"/></circle></g><text x="90" y="282" font-size="13" fill="#58a6ff" text-anchor="middle">PTX</text><text x="810" y="282" font-size="13" fill="#3fb950" text-anchor="middle">SPIR-V</text></svg>