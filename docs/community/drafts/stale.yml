# DRAFT, NOT ENABLED. To enable: copy to .github/workflows/stale.yml
name: Stale
on:
  schedule:
    - cron: "17 3 * * *"
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 14
          only-labels: "status:needs-repro,status:needs-info"
          stale-issue-label: "status:stale"
          exempt-issue-labels: "status:confirmed,security,release-blocker,good-first-issue"
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-message: >
            No activity for 30 days and information is still missing. This will close in 14 days unless you reply.
          close-issue-message: >
            Closing for lack of information. Reopen with the requested details any time.
