[workspace]
members = [".", "crates/cudart_shim", "crates/cublas_shim", "crates/cudnn_shim", "crates/fatbin", "crates/nvrtc_shim", "crates/nvml_shim", "crates/cufft_shim", "crates/cusparse_shim", "crates/cusolver_shim", "crates/detours_sys", "crates/cfi_redirect", "crates/cfi_launcher", "crates/redirect_test/dummy", "crates/redirect_test/consumer", "crates/redirect_test/probe"]
resolver = "2"

[package]
name = "cuda-for-intel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Experimental CUDA Driver API compatibility runtime for Intel GPUs"

[lib]
name = "nvcuda"
crate-type = ["cdylib", "rlib"]

[dependencies]
cfi-fatbin = { path = "crates/fatbin" }
libloading = "0.8"
rspirv = "0.13"

[features]
experimental-batching = []

[dev-dependencies]
nvrtc_shim = { path = "crates/nvrtc_shim" }
